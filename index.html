<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muscle Factory — Built Not Given | Premium Gym & Fitness Center</title>
    <meta name="description" content="Muscle Factory is the premier bodybuilding and fitness center in Nowhar, Charari Sharief, Jammu & Kashmir." />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Plus Jakarta Sans', sans-serif; }
      h1, h2, h3 { font-family: 'Barlow Condensed', sans-serif; }
    </style>
  </head>
  <body class="bg-[#0A0A0A] text-slate-100 antialiased min-h-screen flex flex-col justify-between">
    
    <!-- Navigation Bar -->
    <nav class="border-b border-zinc-800 bg-zinc-950/80 backdrop-blur px-6 py-4 flex justify-between items-center">
      <div class="text-2xl font-black tracking-wider text-white uppercase">
        Muscle <span class="text-[#FF5500]">Factory</span>
      </div>
      <a href="#join" class="bg-[#FF5500] hover:bg-[#e04b00] text-white font-bold px-4 py-2 rounded text-sm uppercase tracking-wider transition">
        Join Now
      </a>
    </nav>

    <!-- Hero Section -->
    <main class="flex-grow flex flex-col justify-center items-center text-center px-4 py-20">
      <span class="text-[#FF5500] font-bold tracking-widest uppercase text-sm mb-3">Nowhar, Charari Sharief</span>
      <h1 class="text-5xl sm:text-7xl font-black uppercase tracking-tight text-white max-w-3xl leading-none mb-6">
        Built <span class="text-[#FF5500]">Not Given</span>
      </h1>
      <p class="text-zinc-400 max-w-xl text-lg mb-8">
        Premier bodybuilding and fitness center. High-end strength equipment, certified coaching, and elite transformation programs.
      </p>
      <div class="flex flex-col sm:flex-row gap-4">
        <a href="#programs" class="bg-[#FF5500] text-white font-extrabold px-8 py-4 rounded uppercase tracking-wider text-base hover:bg-[#e04b00] transition">
          Explore Programs
        </a>
      </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-zinc-900 bg-zinc-950 py-6 text-center text-zinc-500 text-sm">
      <p>© 2026 Muscle Factory. All rights reserved.</p>
    </footer>

  </body>
</html>
